<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josue Estrada</title>

<style>
        .rectangulo {
            height: 40px;
            width: 80px;
            background-color: black;
            border: 1px solid red;
        }
        p {
            color: white;
        }

        .circulo{
            height: 100px;
            width: 100px;
            border-radius: 50%;
            background-color: cyan;
            border: 2px solid blue;
            
        }

        .cuadrado{
            position: relative;
            height: 50px;
            width: 40px;
            background-color: black;
            border: 2px;
            position: relative;
            margin-top: 25px;
            margin-left: 25px;
        }
    </style>

</head>
<body>
    <div class="rectangulo">
        <p>rectangulo</p>
    </div>
    <div class="circulo"></div>
    <div class="cuadrado"></div>
    
</body>
</html>
